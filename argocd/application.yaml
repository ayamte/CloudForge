apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudforge-demo
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/ayamte/CloudForge.git
    targetRevision: main
    path: helm/cloudforge-demo

  destination:
    server: https://kubernetes.default.svc
    namespace: cloudforge-gitops

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true