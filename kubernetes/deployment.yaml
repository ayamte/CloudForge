apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudforge-demo
  namespace: cloudforge-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudforge-demo
  template:
    metadata:
      labels:
        app: cloudforge-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudforge-demo
          image: acrcloudforgeproject26.azurecr.io/cloudforge-demo:v0.1.0
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: APP_VERSION
              value: "v0.1.0"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10